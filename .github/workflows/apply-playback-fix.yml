name: Apply Android playback fix

on:
  push:
    branches:
      - fix/android-lockscreen-playback
  pull_request:
    branches:
      - master

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch playback engine and native expo-audio controls
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          engine = Path('src/playback/engine.ts')
          s = engine.read_text()

          old = """    if (this.wantPlaying && status.playing && this.reportedStartFor !== this.currentItem()?.id) {\n      void this.report('start');\n    }"""
          new = """    if (this.wantPlaying && status.playing) {\n      const startItemId = this.currentItem()?.id ?? null;\n      if (startItemId && this.reportedStartFor !== startItemId) {\n        this.reportedStartFor = startItemId;\n        void this.report('start');\n      }\n    }"""
          if old not in s:
              raise SystemExit('engine: PLAY_START guard not found')
          s = s.replace(old, new, 1)

          old = """      } catch {\n        // Reporting is best-effort; streaming still works without it.\n      }"""
          new = """      } catch {\n        if (kind === 'start' && this.playSessionId === playSessionId && this.reportedStartFor === item.id) {\n          this.reportedStartFor = null;\n        }\n        // Reporting is best-effort; streaming still works without it.\n      }"""
          if old not in s:
              raise SystemExit('engine: report catch not found')
          s = s.replace(old, new, 1)

          old = """  private unsub: { remove: () => void } | null = null;"""
          new = """  private unsub: { remove: () => void } | null = null;\n  private nativeControlUnsubs: { remove: () => void }[] = [];"""
          if old not in s:
              raise SystemExit('engine: unsub field not found')
          s = s.replace(old, new, 1)

          old = """    this.unsub?.remove();\n    this.unsub = null;"""
          new = """    this.unsub?.remove();\n    this.unsub = null;\n    this.nativeControlUnsubs.forEach((subscription) => subscription.remove());\n    this.nativeControlUnsubs = [];"""
          if old not in s:
              raise SystemExit('engine: detach cleanup not found')
          s = s.replace(old, new, 1)

          old = """      player.setActiveForLockScreen(true, {\n        title: item.name,\n        artist: artistLine(item),\n        albumTitle: item.album,\n        artworkUrl,\n      });"""
          new = """      player.setActiveForLockScreen(true, {\n        title: item.name,\n        artist: artistLine(item),\n        albumTitle: item.album,\n        artworkUrl,\n      }, {\n        showSeekForward: true,\n        showSeekBackward: true,\n        ...(Platform.OS === 'android' ? { showNextTrack: true, showPreviousTrack: true } : {}),\n      } as any);\n\n      this.nativeControlUnsubs.forEach((subscription) => subscription.remove());\n      this.nativeControlUnsubs = [];\n      if (Platform.OS === 'android') {\n        const remotePlayer = player as AudioPlayer & {\n          addListener: (event: string, listener: () => void) => { remove: () => void };\n        };\n        this.nativeControlUnsubs.push(\n          remotePlayer.addListener('onRemoteNextTrack', () => { void this.userNext(); }),\n          remotePlayer.addListener('onRemotePreviousTrack', () => { void this.previous(); })\n        );\n      }"""
          if old not in s:
              raise SystemExit('engine: lockscreen activation block not found')
          s = s.replace(old, new, 1)
          engine.write_text(s)

          advance = Path('src/playback/advance.ts')
          a = advance.read_text()
          old = """export type NativePlaybackSignal = {\n  didJustFinish?: boolean;\n  playbackState?: string;\n};"""
          new = """export type NativePlaybackSignal = {\n  didJustFinish?: boolean;\n  playbackState?: string;\n  isLoaded?: boolean;\n  playing?: boolean;\n  currentTime?: number;\n  duration?: number;\n};"""
          if old not in a:
              raise SystemExit('advance: signal type not found')
          a = a.replace(old, new, 1)
          old = """  return Boolean(status.didJustFinish) || status.playbackState === 'ended';"""
          new = """  if (status.didJustFinish || status.playbackState === 'ended') return true;\n  const duration = Number(status.duration ?? 0);\n  const position = Number(status.currentTime ?? 0);\n  return Boolean(\n    status.isLoaded &&\n      !status.playing &&\n      Number.isFinite(duration) &&\n      duration > 1 &&\n      Number.isFinite(position) &&\n      position >= duration - 0.35\n  );"""
          if old not in a:
              raise SystemExit('advance: completion return not found')
          a = a.replace(old, new, 1)
          advance.write_text(a)

          plugin = Path('plugins/withExpoAudioMediaControls.js')
          plugin.parent.mkdir(parents=True, exist_ok=True)
          plugin.write_text(r'''const { withDangerousMod } = require('@expo/config-plugins');
          const fs = require('fs');
          const path = require('path');

          function replaceOnce(file, from, to) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(from)) throw new Error(`expo-audio patch target not found: ${file}`);
            fs.writeFileSync(file, source.replace(from, to));
          }

          module.exports = function withExpoAudioMediaControls(config) {
            return withDangerousMod(config, ['android', async (config) => {
              const root = config.modRequest.projectRoot;
              const pkg = path.join(root, 'node_modules', 'expo-audio');
              const java = path.join(pkg, 'android', 'src', 'main', 'java', 'expo', 'modules', 'audio');
              const records = path.join(java, 'AudioRecords.kt');
              const service = path.join(java, 'service', 'AudioControlsService.kt');
              const callback = path.join(java, 'service', 'AudioMediaSessionCallback.kt');

              replaceOnce(records,
                '  @Field val showSeekBackward: Boolean\n) : Record',
                '  @Field val showSeekBackward: Boolean,\n  @Field val showNextTrack: Boolean = false,\n  @Field val showPreviousTrack: Boolean = false\n) : Record');

              replaceOnce(service,
                '        ACTION_SEEK_FORWARD -> currentPlayerRef.seekTo(currentPlayerRef.currentPosition + SEEK_INTERVAL_MS)',
                '        ACTION_NEXT_TRACK -> currentPlayer?.emit("onRemoteNextTrack", emptyMap<String, Any>())\n        ACTION_PREVIOUS_TRACK -> currentPlayer?.emit("onRemotePreviousTrack", emptyMap<String, Any>())\n        ACTION_SEEK_FORWARD -> currentPlayerRef.seekTo(currentPlayerRef.currentPosition + SEEK_INTERVAL_MS)');

              replaceOnce(service,
                '    if (currentOptions?.showSeekBackward == true) {',
                '    if (currentOptions?.showPreviousTrack == true) {\n      customLayout.add(\n        CommandButton.Builder(CommandButton.ICON_PREVIOUS)\n          .setDisplayName("Previous")\n          .setEnabled(true)\n          .setSessionCommand(SessionCommand(ACTION_PREVIOUS_TRACK, Bundle.EMPTY))\n          .build()\n      )\n    }\n\n    if (currentOptions?.showSeekBackward == true) {');

              replaceOnce(service,
                '    session.setCustomLayout(customLayout)',
                '    if (currentOptions?.showNextTrack == true) {\n      customLayout.add(\n        CommandButton.Builder(CommandButton.ICON_NEXT)\n          .setDisplayName("Next")\n          .setEnabled(true)\n          .setSessionCommand(SessionCommand(ACTION_NEXT_TRACK, Bundle.EMPTY))\n          .build()\n      )\n    }\n\n    session.setCustomLayout(customLayout)');

              replaceOnce(service,
                '            .setCallback(AudioMediaSessionCallback())',
                '            .setCallback(AudioMediaSessionCallback { action ->\n              when (action) {\n                ACTION_NEXT_TRACK -> currentPlayer?.emit("onRemoteNextTrack", emptyMap<String, Any?>())\n                ACTION_PREVIOUS_TRACK -> currentPlayer?.emit("onRemotePreviousTrack", emptyMap<String, Any?>())\n              }\n            })');

              replaceOnce(service,
                '    const val ACTION_SEEK_BACKWARD = "expo.modules.audio.action.SEEK_BACKWARD"',
                '    const val ACTION_SEEK_BACKWARD = "expo.modules.audio.action.SEEK_BACKWARD"\n    const val ACTION_NEXT_TRACK = "expo.modules.audio.action.NEXT_TRACK"\n    const val ACTION_PREVIOUS_TRACK = "expo.modules.audio.action.PREVIOUS_TRACK"');

              replaceOnce(callback,
                'class AudioMediaSessionCallback : MediaSession.Callback {',
                'class AudioMediaSessionCallback(\n  private val onCustomAction: ((String) -> Unit)? = null\n) : MediaSession.Callback {');

              replaceOnce(callback,
                '                .add(SessionCommand(AudioControlsService.ACTION_SEEK_FORWARD, Bundle.EMPTY))',
                '                .add(SessionCommand(AudioControlsService.ACTION_SEEK_FORWARD, Bundle.EMPTY))\n                .add(SessionCommand(AudioControlsService.ACTION_NEXT_TRACK, Bundle.EMPTY))\n                .add(SessionCommand(AudioControlsService.ACTION_PREVIOUS_TRACK, Bundle.EMPTY))');

              replaceOnce(callback,
                '          AudioControlsService.ACTION_SEEK_BACKWARD -> {\n            session.player.seekTo(session.player.currentPosition - AudioControlsService.SEEK_INTERVAL_MS)\n          }',
                '          AudioControlsService.ACTION_SEEK_BACKWARD -> {\n            session.player.seekTo(session.player.currentPosition - AudioControlsService.SEEK_INTERVAL_MS)\n          }\n          AudioControlsService.ACTION_NEXT_TRACK, AudioControlsService.ACTION_PREVIOUS_TRACK -> {\n            onCustomAction?.invoke(command.customAction)\n          }');

              return config;
            }]);
          };
          ''')

          app = Path('app.json')
          data = json.loads(app.read_text())
          plugins = data['expo']['plugins']
          entry = './plugins/withExpoAudioMediaControls'
          if entry not in plugins:
              plugins.append(entry)
          app.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Typecheck
        run: npm install --ignore-scripts && npm run typecheck

      - name: Commit patch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/playback/engine.ts src/playback/advance.ts plugins/withExpoAudioMediaControls.js app.json
          git commit -m "fix: restore Android media controls and playback transitions" || exit 0
          git push
